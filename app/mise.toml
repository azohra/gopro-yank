[tools]
go = "1.27.1"

[tasks.dev]
description = "Run the offline application demo"
run = "go run ./cmd/gopro-yank --demo"

[tasks.format]
run = "gofmt -w cmd internal"

[tasks.build]
run = "go build -trimpath -o gopro-yank ./cmd/gopro-yank"

[tasks.check]
depends = ["build"]
description = "Check formatting, vet, race tests and compilation"
run = """
[ -z "$(gofmt -l cmd internal)" ] || { echo 'Run mise run //app:format' >&2; exit 1; }
go vet ./...
go test -race ./...
"""

[tasks."build:dist"]
description = "Build supported platform archives, Homebrew cask, and checksums"
run = "./scripts/build-dist.sh"
