monorepo_root = true
min_version = "2026.9.5"

[settings]
experimental = true

[monorepo]
config_roots = ["app", "site"]

[monorepo.projects."custom:app"]
root = "app"

[monorepo.projects."custom:site"]
root = "site"

[tools]
gh = "2.100.0"

[tasks.check]
description = "Check the application and website"
depends = ["//app:check", "//site:check"]

[tasks."env:contract"]
hide = true
description = "Every variable this repository needs, and whether it is a secret"
run = """
cat <<'CONTRACT'
secret  CLOUDFLARE_API_TOKEN
CONTRACT
"""

[tasks."release:check"]
description = "Check and package the components changed by a release candidate"
run = '''
#!/usr/bin/env bash
set -euo pipefail
RELEASE_VERSION=$(cat app/VERSION)
export RELEASE_VERSION
files=$(git diff --name-only "${MISE_AFFECTED_BASE:-origin/main}" HEAD -- app/VERSION site/VERSION)
[ -n "$files" ] || { echo 'release:check: no component version changed' >&2; exit 1; }
tasks=()
for file in $files; do
  component=${file%/VERSION}
  tasks+=(::: "//$component:check" ::: "//$component:build:dist")
done
mise run "${tasks[@]:1}"
'''

[tasks.release]
description = "Publish an existing release from its checked candidate artifacts"
usage = 'arg "<tag>" help="Release Please tag to publish or retry"'
run = 'bash scripts/release.sh "$usage_tag"'
