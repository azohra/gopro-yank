# The Makefile keeps the Go recipes; these verbs are the fleet-invariant
# contract over it.

[tools]
wrangler = "4.129.0"
go = "1.27.1"
goreleaser = "2.18.0"
node = "24"
make = "4.4.1"

# What this repository needs in its environment, and which of those
# disclosure would compromise. Read it; do not restate it.
[tasks."env:contract"]
hide = true
description = "Every variable this repository needs, and whether it is a secret"
run = """
cat <<'CONTRACT'
secret  CLOUDFLARE_API_TOKEN
CONTRACT
"""

[tasks.check]
description = "The Makefile's battery: format, vet, race tests, build"
run = "bash scripts/release-source_test.sh && make check build && goreleaser check"

[tasks."build:release"]
description = "Cross-platform release binaries into release/ (version, tag, or dev)"
raw_args = true
run = "./scripts/build-release.sh"

[tasks."release:publish"]
description = "Publish the built assets for a tag at HEAD"
usage = 'arg "<tag>" help="The release tag, e.g. v1.2.3"'
run = """
#!/usr/bin/env bash
set -euo pipefail
tag="${usage_tag:?release:publish: a release tag is required}"
refuse() { echo "release:publish: refusing — $*" >&2; exit 1; }
[[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || refuse "$tag is not a release tag"
[ "$(bash scripts/release-source.sh "$tag")" = "$(git rev-parse HEAD)" ] || refuse "release source is not HEAD"
command -v gh >/dev/null 2>&1 || refuse "GitHub CLI is unavailable"
gh auth status >/dev/null 2>&1 || refuse "GitHub authentication is unavailable"
[ -z "$(git status --porcelain)" ] || refuse "tree is dirty"
[ "$(gh repo view --json nameWithOwner --jq .nameWithOwner)" = "azohra/gopro-yank" ] || refuse "the repository is not azohra/gopro-yank"
git fetch -q origin "refs/tags/$tag"
[ "$(git rev-parse HEAD)" = "$(git rev-parse 'FETCH_HEAD^{commit}')" ] || refuse "$tag does not point at HEAD"
version=${tag#v}
expected_version=$(printf 'version "%s"' "$version")
[ -f release/gopro-yank.rb ] && grep -Fq "$expected_version" release/gopro-yank.rb || refuse "release assets were not built for $tag"
(cd release && shasum -a 256 -c checksums.txt)
shopt -s nullglob
assets=(release/*)
[ -n "${assets[0]-}" ] || refuse "release contains no assets"
existing_draft=""
release_view_error=$(mktemp)
if existing_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>"$release_view_error"); then
  rm -f "$release_view_error"
  [ "$existing_draft" = "true" ] || refuse "release $tag is already published"
else
  if ! grep -Eiq 'not found|HTTP 404|status 404' "$release_view_error"; then
    detail=$(tr '\n' ' ' <"$release_view_error")
    rm -f "$release_view_error"
    refuse "could not inspect release $tag${detail:+: $detail}"
  fi
  rm -f "$release_view_error"
  gh release create "$tag" --draft --generate-notes --title "GoPro Yank $tag" --verify-tag
fi
gh release upload "$tag" "${assets[@]}" --clobber
published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name') || refuse "could not read uploaded assets"
for asset in "${assets[@]}"; do
  asset_name=${asset##*/}
  grep -Fxq "$asset_name" <<<"$published_assets" || refuse "release is missing uploaded asset $asset_name"
done
gh release edit "$tag" --draft=false
published_state=$(gh release view "$tag" --json isDraft --jq .isDraft) || refuse "could not verify published release"
[ "$published_state" = "false" ] || refuse "release $tag is still a draft"
"""

[tasks.deploy]
description = "Deploy the site at the tip of main"
confirm = "Deploy gopro-yank.azohra.com to production?"
timeout = "5m"
usage = 'flag "--dry-run" help="Validate without shipping"'
run = """
#!/usr/bin/env bash
set -euo pipefail
[ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "deploy: refusing — CLOUDFLARE_API_TOKEN is unset" >&2; exit 1; }
[ -z "$(git status --porcelain)" ] || { echo "deploy: refusing — tree is dirty" >&2; exit 1; }
git fetch -q origin main
[ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] || { echo "deploy: refusing — HEAD is not the tip of origin/main" >&2; exit 1; }
mise run check
if [ "${usage_dry_run:-false}" = "true" ]; then
  wrangler deploy --dry-run
  exit 0
fi
wrangler deploy --tag "$(git rev-parse --short HEAD)" --message "$(git log -1 --pretty=%s)"
"""

[tasks."release:source"]
description = "Resolve a release tag to its reviewed main commit"
usage = 'arg "<tag>"'
run = 'bash scripts/release-source.sh "$usage_tag"'
