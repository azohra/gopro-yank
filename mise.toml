[settings]
# The task artifact cache: a task whose inputs are unchanged replays its
# result instead of running again, on a laptop and on a runner alike.
experimental = true

# Two partitions. Every Go file anywhere is the application, plus the module
# files and what the release archives carry; the website is www/. A file that
# belongs to neither does not invalidate either.
[task_config]
global_inputs = ["mise.toml"]

[task_config.input_groups]
app = ["**/*.go", "cmd/**", "internal/**", "go.mod", "go.sum", "LICENSE"]
www = ["www/**", "!www/node_modules/**", "!www/dist/**"]

[vars]
changelog_config = "https://gist.githubusercontent.com/azohra/2bf7f60736469fa8a81ffcb67214e572/raw/cliff.toml"

[tools]
"aqua:orhun/git-cliff" = "2.14.1"
go = "1.27.1"
goreleaser = "2.18.1"
node = "24"
wrangler = "4.129.0"

# What this repository needs in its environment, and which of those
# disclosure would compromise. Read it; do not restate it.
[tasks."env:contract"]
hide = true
description = "Every variable this repository needs, and whether it is a secret"
run = """
cat <<'CONTRACT'
secret  BOSUN_PRIVATE_KEY
secret  CLOUDFLARE_API_TOKEN
secret  GITHUB_TOKEN
value   BOSUN_CLIENT_ID
CONTRACT
"""

[tasks.dev]
description = "Run the offline application demo"
run = "go run ./cmd/gopro-yank --demo"

[tasks.format]
run = "gofmt -w cmd internal"

[tasks.build]
description = "Build the application for this machine"
sources = ["@group:app"]
outputs = ["gopro-yank"]
cache = { enabled = true }
run = "go build -trimpath -o gopro-yank ./cmd/gopro-yank"

[tasks."check:app"]
description = "Check formatting, vet, race tests and compilation"
depends = ["build"]
sources = ["@group:app"]
outputs = []
cache = { enabled = true }
run = """
[ -z "$(gofmt -l cmd internal)" ] || { echo 'Run mise run format' >&2; exit 1; }
go vet ./...
go test -race ./...
"""

[tasks.changelog]
description = "Render the Conventional change history"
run = 'git cliff --config-url "{{vars.changelog_config}}"'

[tasks.dist]
description = "Build every release archive, the checksums and the cask into dist/ without publishing"
sources = ["@group:app", ".goreleaser.yaml"]
outputs = []
cache = { enabled = true }
env = { HOMEBREW_TOOLS_TOKEN = "snapshot" }
run = "goreleaser release --snapshot --clean"

[tasks.release]
description = "Publish the release for the checked-out tag"
run = "goreleaser release --clean"

[tasks."www:setup"]
dir = "www"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."www:dev"]
description = "Develop the website with Vite"
dir = "www"
depends = ["www:setup"]
run = "npm run dev"

[tasks."www:build"]
description = "Build the website into www/dist"
dir = "www"
depends = ["www:setup"]
sources = ["@group:www"]
outputs = ["dist"]
cache = { enabled = true }
run = "npm run build"

[tasks."www:check"]
description = "Build the website and test the installer"
dir = "www"
depends = ["www:build"]
sources = ["@group:www"]
outputs = []
cache = { enabled = true }
run = """
sh -n public/install.sh
npm test
wrangler deploy --dry-run
"""

[tasks."www:deploy"]
description = "Deploy the build in www/dist to Cloudflare"
dir = "www"
confirm = "Deploy gopro-yank.azohra.com to production?"
timeout = "5m"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ -d dist ] || { echo 'www:deploy: no build in www/dist; run mise run www:check first' >&2; exit 1; }
wrangler deploy --tag "$(git rev-parse --short HEAD)"
'''

[tasks.check]
description = "Check the application and the website"
depends = ["check:app", "www:check"]
