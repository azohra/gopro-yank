# The Makefile keeps the Go recipes; these verbs are the fleet-invariant
# contract over it.

[vars]
changelog_config = "https://raw.githubusercontent.com/azohra/conventional-pr/main/cliff.toml"

[env]
# Preserve selection of version tags across all branches.
GIT_CLIFF__GIT__USE_BRANCH_TAGS = "false"

[tools]
wrangler = "4.129.0"
go = "1.27.1"
"aqua:orhun/git-cliff" = "2.14.1"
node = "24"
make = "4.4.1"

# What this repository needs in its environment, and which of those
# disclosure would compromise. Read it; do not restate it.
[tasks."env:contract"]
hide = true
description = "Every variable this repository needs, and whether it is a secret"
run = """
cat <<'CONTRACT'
secret  CLOUDFLARE_API_TOKEN
CONTRACT
"""

[tasks.check]
description = "The Makefile's battery: format, vet, race tests, build"
run = "make check build"

[tasks.changelog]
description = "Render change history or export structured records"
usage = 'flag "--json" help="Export structured Git history"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "${usage_json:-false}" = true ]; then
  exec git cliff --config-url "{{vars.changelog_config}}" --context
fi
git cliff --config-url "{{vars.changelog_config}}"
'''

[tasks."build:dist"]
description = "Build supported platform archives, Homebrew cask, and checksums"
run = "./scripts/build-dist.sh"

[tasks.release]
description = "Build and publish a release from current main"
tools = { gh = "2.100.0" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ -z "$(git status --porcelain)" ] || { echo 'release: commit changes first' >&2; exit 1; }
git fetch -q origin main --tags
head=$(git rev-parse HEAD)
[ "$head" = "$(git rev-parse origin/main)" ] || { echo 'release: check out current main first' >&2; exit 1; }
tag=$(git cliff --config-url "{{vars.changelog_config}}" --offline --unreleased --bumped-version)
[[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
[ "$tag" != "$(git describe --tags --abbrev=0 --match 'v[0-9]*')" ] || { echo 'No new Conventional changes to release'; exit 0; }
RELEASE_VERSION="${tag#v}" mise run build:dist
git cliff --config-url "{{vars.changelog_config}}" --unreleased --tag "$tag" > release/notes.md
gh release create "$tag" release/gopro-yank_*.tar.gz release/gopro-yank_*.zip release/gopro-yank.rb release/checksums.txt \
  --repo azohra/gopro-yank --target "$head" \
  --title "GoPro Yank $tag" --notes-file release/notes.md
'''

[tasks.deploy]
description = "Deploy the site at the tip of main"
confirm = "Deploy gopro-yank.azohra.com to production?"
timeout = "5m"
usage = 'flag "--dry-run" help="Validate without shipping"'
run = """
#!/usr/bin/env bash
set -euo pipefail
[ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "deploy: refusing — CLOUDFLARE_API_TOKEN is unset" >&2; exit 1; }
[ -z "$(git status --porcelain)" ] || { echo "deploy: refusing — tree is dirty" >&2; exit 1; }
git fetch -q origin main
[ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] || { echo "deploy: refusing — HEAD is not the tip of origin/main" >&2; exit 1; }
if [ "${usage_dry_run:-false}" = "true" ]; then
  wrangler deploy --dry-run
  exit 0
fi
wrangler deploy --tag "$(git rev-parse --short HEAD)" --message "$(git log -1 --pretty=%s)"
"""
