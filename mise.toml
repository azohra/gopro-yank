# mise is the command surface for this repo: `mise tasks` lists the verbs.
# The Makefile keeps the Go recipes; these verbs are the fleet-invariant
# contract over it.

[tasks.setup]
description = "Arm the commit gate"
run = "mise generate git-pre-commit --write --task=pre-commit"

[tasks.check]
description = "The Makefile's battery: format, vet, race tests, build"
run = "make check build"

[tasks.pre-commit]
description = "Commit gate: branches author, main never does"
run = """
#!/usr/bin/env bash
set -euo pipefail
[ "$(git branch --show-current)" != "main" ] || { echo "pre-commit: refusing — commits are authored on branches, never on main" >&2; exit 1; }
mise run check
"""
