monorepo_root = true
min_version = "2026.9.5"

[settings]
experimental = true

[monorepo]
config_roots = ["app", "site"]

[monorepo.projects."custom:app"]
root = "app"

[monorepo.projects."custom:site"]
root = "site"

[task_config]
global_inputs = ["mise.toml", "LICENSE", "README.md", "CONTRIBUTING.md", "docs/**"]

[tasks.check]
description = "Check the application and website"
depends = ["//app:check", "//site:check"]

[tasks."env:contract"]
hide = true
description = "Every variable this repository needs, and whether it is a secret"
run = """
cat <<'CONTRACT'
secret  CLOUDFLARE_API_TOKEN
CONTRACT
"""
