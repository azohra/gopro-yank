<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">GoPro Yank — every original, downloaded and verified</title>
  <desc id="desc">GoPro cloud originals flow into a verified portable archive</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#26343b" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1115"/>
      <stop offset="1" stop-color="#101a20"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#fade)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)" opacity=".32"/>

  <g transform="translate(62 72) scale(.72)">
    <rect x="8" y="8" width="224" height="224" rx="54" fill="#111c22" stroke="#30424b" stroke-width="2"/>
    <path d="M62 58l58 52 58-52" fill="none" stroke="#f4f0e8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 108v50m-24-22 24 24 24-24" fill="none" stroke="#ff5c35" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55 132v46c0 10 8 18 18 18h94c10 0 18-8 18-18v-46" fill="none" stroke="#58e0b4" stroke-width="14" stroke-linecap="round"/>
    <circle cx="186" cy="55" r="8" fill="#58e0b4"/>
  </g>

  <text x="260" y="158" fill="#f4f0e8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="72" font-weight="750" letter-spacing="-4">gopro<tspan fill="#ff5c35">-yank</tspan></text>
  <text x="264" y="211" fill="#8fa7b2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" letter-spacing="3">EVERY ORIGINAL.</text>
  <text x="264" y="246" fill="#58e0b4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" letter-spacing="2">DOWNLOADED AND VERIFIED.</text>

  <g transform="translate(768 74)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="360" height="272" rx="18" fill="#0b1115" stroke="#30424b" stroke-width="2"/>
    <circle cx="24" cy="24" r="5" fill="#ff5c35"/><circle cx="42" cy="24" r="5" fill="#f2bd5b"/><circle cx="60" cy="24" r="5" fill="#58e0b4"/>
    <path d="M24 48h312" stroke="#26343b"/>
    <text x="24" y="82" fill="#8fa7b2" font-size="15">SOURCE</text>
    <text x="112" y="82" fill="#f4f0e8" font-size="15">all originals</text>
    <text x="24" y="120" fill="#8fa7b2" font-size="15">ARCHIVE</text>
    <text x="112" y="120" fill="#f4f0e8" font-size="15">portable</text>
    <text x="24" y="158" fill="#8fa7b2" font-size="15">VERIFY</text>
    <text x="112" y="158" fill="#58e0b4" font-size="15">files intact</text>
    <path d="M24 188h312" stroke="#26343b"/>
    <text x="24" y="226" fill="#58e0b4" font-size="15" font-weight="700">✓ EXPORT COMPLETE</text>
    <rect x="24" y="244" width="312" height="5" rx="2.5" fill="#26343b"/>
    <rect x="24" y="244" width="312" height="5" rx="2.5" fill="#ff5c35"/>
