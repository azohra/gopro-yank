[tools]
node = "24"
wrangler = "4.129.0"

[tasks.setup]
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Develop the website with Vite"
depends = ["setup"]
run = "npm run dev"

[tasks.build]
description = "Build the website into dist"
depends = ["setup"]
run = "npm run build"

[tasks.check]
description = "Build the website and check installation"
depends = ["build"]
run = """
sh -n public/install.sh
npm test
"""

[tasks.deploy]
description = "Build and deploy the website"
depends = ["build"]
confirm = "Deploy gopro-yank.azohra.com to production?"
timeout = "5m"
run = "wrangler deploy"
