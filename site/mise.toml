[tools]
node = "24"
wrangler = "4.129.0"

[tasks.setup]
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Develop the website with Vite"
depends = ["setup"]
run = "npm run dev"

[tasks.build]
description = "Build the website into dist"
depends = ["setup"]
run = "npm run build"

[tasks.check]
description = "Build the website and check installation"
depends = ["build"]
run = """
sh -n public/install.sh
npm test
"""

[tasks.deploy]
description = "Deploy a published website release"
confirm = "Deploy gopro-yank.azohra.com to production?"
timeout = "5m"
usage = '''
arg "[tag]" help="Website release tag; defaults to the latest site tag reachable from this checkout"
flag "--dry-run" help="Validate the published build without deploying"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
git fetch -q origin --tags
tag=${usage_tag:-$(git describe --tags --abbrev=0 --match 'site/v*')}
[ "$(gh release view "$tag" --repo azohra/gopro-yank --json isDraft --jq .isDraft)" = false ] || { echo 'deploy: publish the release first' >&2; exit 1; }
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
mkdir "$scratch/dist"
gh release download "$tag" --repo azohra/gopro-yank --pattern site.tar.gz --dir "$scratch"
tar -xzf "$scratch/site.tar.gz" -C "$scratch/dist"
git show "$tag:site/wrangler.jsonc" > "$scratch/wrangler.jsonc"
args=()
[ "${usage_dry_run:-false}" != true ] || args+=(--dry-run)
wrangler deploy --config "$scratch/wrangler.jsonc" --tag "$tag" "${args[@]}"
'''

[tasks."build:dist"]
depends = ["build"]
description = "Archive the built website"
run = "mkdir -p release && COPYFILE_DISABLE=1 tar -czf release/site.tar.gz -C dist ."
