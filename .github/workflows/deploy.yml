name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.5
          install_args: node wrangler
      - run: |
          base=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$base" ]; then
            mise run //site:deploy
          else
            mise run --affected --affected-base "$base" //site:deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
