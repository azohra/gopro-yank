name: Check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Check a generated release candidate
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_AFFECTED_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: "${{ (contains(github.event.pull_request.labels.*.name, 'autorelease: pending') && github.event.pull_request.head.sha) || github.ref }}"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.5
          install: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/mise.toml') }}-${{ hashFiles('app/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/mise.toml') }}-
      - if: "${{ !(inputs.release || contains(github.event.pull_request.labels.*.name, 'autorelease: pending')) }}"
        run: mise run --affected '//...:check' ':::' //app:build:dist
      - if: "${{ inputs.release || contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}"
        run: mise run release:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: "${{ inputs.release || contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}"
        with:
          name: release-${{ github.event.pull_request.head.sha || github.sha }}
          path: '*/release/*'
          if-no-files-found: error
          retention-days: 90
          overwrite: true
