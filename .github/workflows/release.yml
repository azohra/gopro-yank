name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.5
          install: false
      - id: publish
        run: mise run release:publish
      - if: steps.publish.outputs.site_tag != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_TAG: ${{ steps.publish.outputs.site_tag }}
        run: mise run //site:deploy -- "$SITE_TAG"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - run: mise run release:prepare
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        id: pr
        with:
          branch: release/next
          delete-branch: true
          add-paths: |
            app/VERSION
            app/CHANGELOG.md
            site/VERSION
            site/CHANGELOG.md
          commit-message: 'chore(release): prepare component releases'
          title: 'chore(release): publish prepared component releases'
          body: |
            ## Summary

            Publish the component versions and changelogs in this PR using the artifacts retained by its successful Check run. Website publication also deploys the prepared website bundle.
      - if: steps.pr.outputs.pull-request-number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh workflow run check.yml --ref release/next
          gh workflow run conventional-pr.yml --ref release/next -f pr="$PR_NUMBER"
