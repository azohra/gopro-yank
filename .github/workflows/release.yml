name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run check
      - name: Build release
        run: mise run build:release "$GITHUB_REF_NAME"
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:publish "$GITHUB_REF_NAME"
