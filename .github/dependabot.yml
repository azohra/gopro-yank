version: 2
updates:
  - package-ecosystem: github-actions
    labels: ["dependencies"]
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Vancouver
    open-pull-requests-limit: 2
    cooldown:
      default-days: 1
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: gomod
    labels: ["dependencies"]
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Vancouver
    open-pull-requests-limit: 2
    cooldown:
      default-days: 1
    groups:
      gomod-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: fix
      include: scope
  - package-ecosystem: npm
    labels: ["dependencies"]
    directory: /www
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Vancouver
    open-pull-requests-limit: 2
    cooldown:
      default-days: 1
    groups:
      npm-production-minor-patch:
        patterns: ["*"]
        dependency-type: production
        update-types: [minor, patch]
      npm-development-minor-patch:
        patterns: ["*"]
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: fix
      prefix-development: build
      include: scope
